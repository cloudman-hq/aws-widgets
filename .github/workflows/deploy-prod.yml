# Production deploy. Fires on a pushed tag matching release-*.
# The deploy job targets the `production` GitHub environment, which requires a
# reviewer decision and accepts only `release-*` tags.
#
# Node is pinned to 10.x because node-sass@4.13.1 has no prebuilt binary above
# Node 13. The action versions are independent of that constraint.

name: Deploy to Prod

on:
  push:
    tags:
      - release-*

# A constant group. Keying on github.ref would give every tag its own group and
# serialize nothing, so an older release approved late could overwrite a newer one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and Unit Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 10.x
        uses: actions/setup-node@v4
        with:
          node-version: 10.x
      - run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint:check
      - name: Unit tests
        run: yarn test --ci
      - name: Build
        run: yarn build
      # The deploy job publishes this exact artifact, so the bytes that were tested
      # are the bytes that ship.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: build
          retention-days: 7
          if-no-files-found: error

  deploy-prod:
    name: Deploy legacy Connect app to production
    needs: build
    runs-on: ubuntu-latest
    # The credential is stored on this environment, not on the repository. A workflow
    # that declares no environment cannot read it, so every historical commit's
    # ungated deploy job fails closed instead of publishing.
    environment: production

    steps:
      - uses: actions/checkout@v4
      # Node 22 here, not the repository's pinned 10.x. This job runs the Firebase
      # CLI and installs functions/, neither of which needs the legacy toolchain.
      # firebase-tools 15 requires Node >= 20, and it is the first CLI in this
      # repository that can deploy a nodejs22 Cloud Functions runtime.
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Download the tested build output
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: build
      # firebase-tools loads the functions source to discover triggers, so the
      # dependencies must be installed before the deploy.
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci
      # --force: firebase-tools 15 exits nonzero if it cannot also set an
      # Artifact Registry cleanup policy for function container images, and
      # skips prompting to delete a function missing from source. Every
      # function in functions/index.js is deployed here, so nothing is deleted.
      - name: Deploy hosting and functions to Firebase production
        run: npx --yes firebase-tools@15.29.0 deploy --force --project prod --token ${{ secrets.FIREBASE_TOKEN }}
