# Pull requests run the secretless Build and Unit Test gate only.
# Pushes to prod-release run the same gate, then deploy the tested artifact to the
# Firebase stage project.
#
# Node is pinned to 10.x because node-sass@4.13.1 has no prebuilt binary above Node 13
# and its node-gyp@3.8.0 fallback needs Python 2. The action versions are independent
# of that constraint, so they track current majors. See docs/policies/git-workflow.md.

name: Build, Test and Stage

on:
  push:
    branches: [ prod-release ]  # master has code that is not ready for prod
  pull_request:
    branches: [ prod-release ]
    # ready_for_review is not a default activity type. Without it, marking a Draft PR
    # Ready starts no run, and the lifecycle skills wait for one that never appears.
    types: [opened, synchronize, reopened, ready_for_review]

# Include the event so a push run and a pull request run for the same branch do not
# cancel each other. Cancellation is limited to pull requests: cancelling a push run
# can kill an in-flight `firebase deploy` and leave the stage site half-updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # No strategy.matrix here. A matrix appends its value to the check name
  # ("Build and Unit Test (10.x)"), and branch protection must name the check
  # exactly. One Node version needs no matrix.
  build:
    name: Build and Unit Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 10.x
        uses: actions/setup-node@v4
        with:
          node-version: 10.x
      - run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint:check
      - name: Unit tests
        run: yarn test --ci
      - name: Build
        run: yarn build
      # The deploy job publishes this exact artifact, so the bytes that were tested
      # are the bytes that ship.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: build
          retention-days: 7
          if-no-files-found: error

  deploy-stage:
    name: Deploy legacy Connect app to stage
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The credential is stored on this environment, not on the repository. A workflow
    # that declares no environment cannot read it, so every historical commit's
    # ungated deploy job fails closed instead of publishing.
    environment: stage

    steps:
      - uses: actions/checkout@v4
      # Node 22 here, not the repository's pinned 10.x. This job runs the Firebase
      # CLI and installs functions/, neither of which needs the legacy toolchain.
      # firebase-tools 15 requires Node >= 20, and it is the first CLI in this
      # repository that can deploy a nodejs22 Cloud Functions runtime.
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Download the tested build output
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: build
      # firebase-tools loads the functions source to discover triggers, so the
      # dependencies must be installed before the deploy.
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Deploy hosting and functions to Firebase stage
        run: npx --yes firebase-tools@15.29.0 deploy --project stage --token ${{ secrets.FIREBASE_TOKEN }}
